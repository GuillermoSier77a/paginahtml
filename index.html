<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Selecciona un sitio</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-image: url('https://i.imgur.com/sJUO8Ok.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: white;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.7);
    }

    h1 {
      margin-bottom: 30px;
    }

    a.button {
      display: inline-block;
      padding: 12px 24px;
      margin: 10px;
      background-color: rgba(44, 62, 80, 0.85);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: background-color 0.3s;
    }

    a.button:hover {
      background-color: rgba(26, 37, 47, 0.9);
    }
  </style>
</head>
<body>
  <h1>¿A qué página deseas ir?</h1>

  <a class="button" href="https://www.tungsteno.io/post/app-flow_space_vector_field/" target="_blank">

  </a>

</html>
